[workspace]
channels = ["conda-forge"]
name = "RynnWorld-4D"
platforms = [{ platform = "linux-64", cuda = "12.8" }]
version = "0.1.0"

[tasks]
# Download pretrained models into ./pretrained/ (Wan backbone + released
# RynnWorld-4D weights + DA3 for the policy head). Safe to re-run.
download-models = """
bash -c '\
  mkdir -p pretrained && \
  export HF_HUB_ENABLE_HF_TRANSFER=1 && \
  hf download Wan-AI/Wan2.2-TI2V-5B-Diffusers --local-dir ./pretrained/Wan2.2-TI2V-5B-Diffusers && \
  hf download Alibaba-DAMO-Academy/RynnWorld-4D --local-dir ./pretrained/RynnWorld-4D && \
  hf download depth-anything/DA3-LARGE --local-dir ./pretrained/da3 && \
  echo "=== all pretrained models ready ===" '
"""
# CPU-safe environment check. Reading package metadata does not import PyTorch
# or initialize CUDA.
verify = "python -c \"from importlib.metadata import version; names = ('torch', 'accelerate', 'deepspeed', 'diffusers', 'transformers', 'tensorboard'); print('\\n'.join(f'{name}={version(name)}' for name in names))\""
# Run only when the GPU is available for this process.
verify-gpu = "python -c \"import torch; assert torch.cuda.is_available(), 'CUDA is not available'; print(f'cuda={torch.version.cuda}'); print(f'gpu={torch.cuda.get_device_name(0)}')\""
# One non-zero-LR optimizer step from the released stage-3 checkpoint. This
# targets a single 32 GB GPU by offloading parameters and optimizer state.
train-pretrained-smoke = "bash scripts/train_pretrained_smoke.sh"
train-pretrained-amuse-smoke = "bash scripts/train_pretrained_amuse_smoke.sh"
test-cpu = "CUDA_VISIBLE_DEVICES='' python -m pytest tests -q"
lint-cpu = "ruff check core/finetune/compact_checkpoint.py core/finetune/config.py core/finetune/datasets/colmap_rgbdf_latents.py core/finetune/datasets/colmap_rgbdf_source.py core/finetune/optim core/finetune/preprocessing core/finetune/tensorboard.py core/finetune/topk_checkpointing.py scripts/prepare_colmap_rgbdf.py scripts/encode_colmap_rgbdf_latents.py scripts/train_colmap_rgbdf.py scripts/train_ready.py scripts/amuse_deepspeed_smoke.py tests"
check-cpu = "bash -c \"CUDA_VISIBLE_DEVICES='' python -m pytest tests -q && ruff check core/finetune/compact_checkpoint.py core/finetune/config.py core/finetune/datasets/colmap_rgbdf_latents.py core/finetune/datasets/colmap_rgbdf_source.py core/finetune/optim core/finetune/preprocessing core/finetune/tensorboard.py core/finetune/topk_checkpointing.py scripts/prepare_colmap_rgbdf.py scripts/encode_colmap_rgbdf_latents.py scripts/train_colmap_rgbdf.py scripts/train_ready.py scripts/amuse_deepspeed_smoke.py tests\""
audit-rgbdf-cpu = "python -m scripts.prepare_colmap_rgbdf audit-metadata"
prepare-rgbdf-cpu = "python -m scripts.prepare_colmap_rgbdf materialize"
encode-rgbdf-latents = "python -m scripts.encode_colmap_rgbdf_latents"
training-config = "python -m scripts.train_colmap_rgbdf --cfg job --resolve mode=config"
amuse-deepspeed-smoke = "accelerate launch --use_deepspeed --num_processes 1 --num_machines 1 --gpu_ids 0 --mixed_precision bf16 --dynamo_backend no --deepspeed_config_file configs_zero/zero3_offload_amuse.yaml --zero3_init_flag false --zero3_save_16bit_model false scripts/amuse_deepspeed_smoke.py"
train-rgbdf-smoke = "python -m scripts.train_colmap_rgbdf trainer=smoke"
train-rgbdf-full = "python -m scripts.train_colmap_rgbdf"
train-ready = "python -m scripts.train_ready"
tensorboard = "bash -c 'tensorboard --logdir \"${RYNNWORLD_TENSORBOARD_LOGDIR:-outputs/training}\" --bind_all'"
# World-model inference with the released stage-3 checkpoint.
inference = """
python inference-sft.py \
  --model_path ./pretrained/Wan2.2-TI2V-5B-Diffusers \
  --checkpoint_path ./pretrained/RynnWorld-4D \
  --json_path ./data/sample.json \
  --output_dir ./results/inference-sft \
  --num_inference_steps 50 \
  --guidance_scale 1.0
"""
# Optional: install the extra deps for RynnWorld-4D-Policy on top of this env
# (flash-attn compiles against the installed torch; takes a long time).
policy-env = "bash rynnworld4d_policy/policy_env.sh"

[dependencies]
python = "3.10.*"
pip = ">=25"

[pypi-dependencies]
# The upstream README uses torch cu121. This Blackwell profile instead selects
# the CUDA 12.8-compatible PyTorch release.
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu128" }
# requirements.txt
diffusers = "==0.35.2"
transformers = "==4.57.1"
accelerate = "==1.12.0"
sentencepiece = "==0.2.1"
peft = "==0.18.0"
ftfy = "==6.3.1"
numpy = "==1.26.4"
wandb = "==0.23.0"
tensorboard = "==2.21.0"
hydra-core = ">=1.3.2,<1.4"
pytest = ">=8,<10"
ruff = ">=0.12,<1"
decord = "==0.6.0"
deepspeed = "==0.18.2"
opencv-python-headless = "*"
imageio = "*"
imageio-ffmpeg = "*"
tyro = "*"
termcolor = "*"
# model download helper (hf CLI) + fast transfer
huggingface-hub = { version = ">=0.36", extras = ["hf_transfer"] }
# editable install of the rynnworld4d package (setup.py)
rynnworld4d = { path = ".", editable = true }
